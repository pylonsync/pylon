<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>__PYLON_NAME__ · Pylon Studio</title>
		<!-- Studio extensions import React by name. Each name maps to a module
		     that re-exports the React that Studio runs on. The map must come
		     before the first module script. See src/lib/module-shims.ts. -->
		<script type="importmap">
			{
				"imports": {
					"react": "/studio/modules/react.js",
					"react-dom": "/studio/modules/react-dom.js",
					"react-dom/client": "/studio/modules/react-dom-client.js",
					"react/jsx-runtime": "/studio/modules/react-jsx-runtime.js",
					"react/jsx-dev-runtime": "/studio/modules/react-jsx-dev-runtime.js"
				}
			}
		</script>
		<script>
			// Injected by the Rust handler. The escape helpers in
			// crates/studio_api/src/lib.rs make these XSS-safe inside this
			// <script> block — see the security tests in that file.
			window.__PYLON_API__ = "__PYLON_API_BASE__";
			window.__PYLON_MANIFEST__ = __PYLON_MANIFEST_JSON__;
			window.__PYLON_STUDIO_CONFIG__ = __PYLON_STUDIO_CONFIG_JSON__;
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
