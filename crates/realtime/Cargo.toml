[package]
name = "pylon-realtime"
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[features]
default = []
# Enable MessagePack snapshot encoding. Adds `rmp-serde` dependency.
msgpack = ["dep:rmp-serde", "dep:rmp"]
# Enable bincode snapshot encoding. Adds `bincode` dependency.
bincode = ["dep:bincode"]

[dependencies]
pylon-kernel = { path = "../core", version = "0.22.23" }  # x-release-please-version
pylon-replication = { path = "../replication", version = "0.22.23" }  # x-release-please-version
serde = { workspace = true }
# raw_value: RawInput cuts the `input` out of a JSON envelope undecoded.
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }
# Shard tickets: HMAC-SHA256 signed claims, base64url on the wire. All
# pure Rust, so the crate still builds for wasm32 (Workers).
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rmp-serde = { version = "1.3", optional = true }
rmp = { version = "0.8", optional = true }
bincode = { version = "1.3", optional = true }

[dev-dependencies]
# tests/wire_fixtures.rs writes MessagePack with the encoder the server uses.
rmp-serde = "1.3"

[[bench]]
name = "interest_bench"
harness = false

[[bench]]
name = "replication_bench"
harness = false
