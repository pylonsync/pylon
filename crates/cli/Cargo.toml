[package]
name = "pylon-cli"
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[[bin]]
name = "pylon"
path = "src/main.rs"

[dependencies]
pylon-kernel = { path = "../core", version = "0.7.0" }  # x-release-please-version
pylon-plugin = { path = "../plugin", version = "0.7.0" }  # x-release-please-version
pylon-schema = { path = "../schema", version = "0.7.0" }  # x-release-please-version
pylon-storage = { path = "../storage", version = "0.7.0", features = ["postgres-live"] }  # x-release-please-version
pylon-runtime = { path = "../runtime", version = "0.7.0" }  # x-release-please-version
pylon-staticgen = { path = "../staticgen", version = "0.7.0" }  # x-release-please-version
pylon-migrate = { path = "../migrate", version = "0.7.0" }  # x-release-please-version
pylon-policy = { path = "../policy", version = "0.7.0" }  # x-release-please-version
pylon-auth = { path = "../auth", version = "0.7.0" }  # x-release-please-version
rusqlite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"
# Device-flow login (`pylon login`): a CSPRNG-generated device code the
# CLI opens in the browser and polls exchangeCliAuthCode for after approval.
rand = { workspace = true }
# Cloud deploy + login flows: sync HTTP, gzip-tar bundling. ureq is
# chosen over reqwest because the CLI is single-shot — pulling in a
# Tokio runtime to fire one POST is wasteful + bloats the static
# binary by ~3MB. ureq also handles HTTPS natively via rustls.
ureq = { version = "2.10", features = ["json", "tls"] }
# Hidden password entry for `pylon admin create/passwd`. A password passed as
# an argument lands in shell history and in `ps` output; the prompt is the
# default path and this is what makes it not echo.
rpassword = "7"
# `pylon dev` hot reload: event-driven filesystem watcher (FSEvents on
# macOS, inotify on Linux). Replaces a 500ms mtime poll that measured as
# the single largest slice of edit→reload latency. Falls back to the poll
# if the platform watcher can't be created.
notify = "6.1.1"
tar = "0.4"
flate2 = "1.0"
base64 = { workspace = true }
# Artifact-bundle integrity: the boot-time fetch verifies the downloaded
# bundle's SHA-256 against the hash the control plane injected via env
# before extracting (see commands/artifact.rs).
sha2 = { workspace = true }

# `pylon dev` hot reload: close inherited descriptors before re-exec'ing so
# sockets accepted by the outgoing process image don't survive into the new
# one as connections nothing is servicing (see close_inherited_fds). Windows
# has no exec, so the reload path there respawns instead and needs none of it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `pylon doctor`'s free-space check. Windows has no `df`, so it asks the
# volume through GetDiskFreeSpaceExW instead of skipping the check.
#
# Win32_Foundation is listed because that function returns a `BOOL`, which
# lives behind it. Cargo would unify the feature in from pylon-kernel today,
# so leaving it out compiles — until pylon-kernel stops needing it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
