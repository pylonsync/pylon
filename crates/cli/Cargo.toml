[package]
name = "pylon-cli"
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[[bin]]
name = "pylon"
path = "src/main.rs"

[dependencies]
pylon-kernel = { path = "../core", version = "0.3.334" }
pylon-plugin = { path = "../plugin", version = "0.3.334" }
pylon-schema = { path = "../schema", version = "0.3.334" }
pylon-storage = { path = "../storage", version = "0.3.334", features = ["postgres-live"] }
pylon-runtime = { path = "../runtime", version = "0.3.334" }
pylon-staticgen = { path = "../staticgen", version = "0.3.334" }
pylon-migrate = { path = "../migrate", version = "0.3.334" }
pylon-policy = { path = "../policy", version = "0.3.334" }
pylon-auth = { path = "../auth", version = "0.3.334" }
rusqlite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"
# Device-flow login (`pylon login`): a CSPRNG-generated device code the
# CLI opens in the browser and polls exchangeCliAuthCode for after approval.
rand = { workspace = true }
# Cloud deploy + login flows: sync HTTP, gzip-tar bundling. ureq is
# chosen over reqwest because the CLI is single-shot — pulling in a
# Tokio runtime to fire one POST is wasteful + bloats the static
# binary by ~3MB. ureq also handles HTTPS natively via rustls.
ureq = { version = "2.10", features = ["json", "tls"] }
# `pylon dev` hot reload: event-driven filesystem watcher (FSEvents on
# macOS, inotify on Linux). Replaces a 500ms mtime poll that measured as
# the single largest slice of edit→reload latency. Falls back to the poll
# if the platform watcher can't be created.
notify = "6.1.1"
tar = "0.4"
flate2 = "1.0"
base64 = { workspace = true }
# Artifact-bundle integrity: the boot-time fetch verifies the downloaded
# bundle's SHA-256 against the hash the control plane injected via env
# before extracting (see commands/artifact.rs).
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
