[package]
name = "pylon-runtime"
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pylon-kernel = { path = "../core", version = "0.3.245" }
pylon-http = { path = "../http", version = "0.3.245" }
pylon-router = { path = "../router", version = "0.3.245" }
pylon-auth = { path = "../auth", version = "0.3.245" }
pylon-policy = { path = "../policy", version = "0.3.245" }
pylon-plugin = { path = "../plugin", version = "0.3.245" }
pylon-sync = { path = "../sync", version = "0.3.245" }
pylon-studio-api = { path = "../studio_api", version = "0.3.245" }
pylon-storage = { path = "../storage", version = "0.3.245", features = ["postgres-live"] }
pylon-crdt = { path = "../crdt", version = "0.3.245" }
pylon-functions = { path = "../functions", version = "0.3.245" }
pylon-migrate = { path = "../migrate", version = "0.3.245" }
pylon-observability = { path = "../observability", version = "0.3.245" }
pylon-realtime = { path = "../realtime", version = "0.3.245" }
# Cross-machine fanout. Default build links the Noop bus only; the
# `redis-bus` feature pulls the Redis impl so operators running
# horizontally-scaled deploys can enable PYLON_CLUSTER_BUS=redis://...
# without a separate build.
pylon-cluster = { path = "../cluster", version = "0.3.245", features = ["redis-bus"] }
postgres = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = { workspace = true }
tungstenite = { workspace = true }
tracing = { workspace = true }
# HTTP client for the optional Tinybird request-log shipper. Lives
# under feature `tinybird` so the dep is opt-in but enabled by default
# on Pylon Cloud builds (always-on at the binary level — gated at
# runtime by the absence of PYLON_TINYBIRD_TOKEN env, not at compile).
ureq = { workspace = true }
# WebSocket handshake on the multiplexed HTTP port: sha1 + base64
# compute Sec-WebSocket-Accept ourselves so tiny_http can hijack the
# socket without going back through tungstenite's accept path.
sha1 = { workspace = true }
base64 = { workspace = true }
# AEAD (ChaCha20-Poly1305) for field.encrypted() at-rest encryption.
# Ring is already used by pylon-auth; same dep, no new system requirements.
ring = { workspace = true }
# SHA-256 for ctx.connections.* stable id (hash of user+connection
# name fits Pylon's 40-char id constraint).
sha2 = { workspace = true }
# Image processing pipeline for <Image>.
#
# Decode: `image` crate (pure Rust). Handles JPEG, PNG, WebP, GIF
# inputs. Decode is the cheap part; we don't need a faster decoder.
#
# Resize: `fast_image_resize` — SIMD-accelerated (AVX2 / NEON).
# Benchmarks show 10-50x faster than `image::imageops::resize` at
# the same Lanczos3 quality. Pure Rust, no sys deps.
#
# Encode (JPEG): `mozjpeg` — bundles Mozilla's mozjpeg C source via
# cc-rs. ~15-25% smaller files than libjpeg-turbo at the same
# perceptual quality. Adds ~2MB to the binary but no runtime sys
# dep.
#
# Encode (WebP): `webp` — bundles libwebp source via cc-rs. Lossy
# WebP, which produces 30-40% smaller files than the pure-Rust
# `image` crate's lossless-only WebP. ~1MB binary growth.
#
# AVIF deliberately omitted — would pull `ravif` + `rav1e` (encoder),
# adding ~10MB to the binary and 5-20x slower encodes than WebP for
# similar quality. Worth revisiting in a follow-up if Pylon Cloud
# wants to A/B AVIF for high-traffic sites.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
fast_image_resize = { version = "5", features = ["image"] }
mozjpeg = { version = "0.10", default-features = false }
webp = "0.3"

[dev-dependencies]
rand = { workspace = true }
tempfile = "3"

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "sync_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "realtime_bench"
harness = false

