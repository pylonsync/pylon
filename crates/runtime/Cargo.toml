[package]
name = "pylon-runtime"
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pylon-kernel = { path = "../core", version = "0.3.94" }
pylon-http = { path = "../http", version = "0.3.94" }
pylon-router = { path = "../router", version = "0.3.94" }
pylon-auth = { path = "../auth", version = "0.3.94" }
pylon-policy = { path = "../policy", version = "0.3.94" }
pylon-plugin = { path = "../plugin", version = "0.3.94" }
pylon-sync = { path = "../sync", version = "0.3.94" }
pylon-studio-api = { path = "../studio_api", version = "0.3.94" }
pylon-storage = { path = "../storage", version = "0.3.94", features = ["postgres-live"] }
pylon-crdt = { path = "../crdt", version = "0.3.94" }
pylon-functions = { path = "../functions", version = "0.3.94" }
pylon-migrate = { path = "../migrate", version = "0.3.94" }
pylon-observability = { path = "../observability", version = "0.3.94" }
pylon-realtime = { path = "../realtime", version = "0.3.94" }
postgres = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = { workspace = true }
tungstenite = { workspace = true }
tracing = { workspace = true }
# HTTP client for the optional Tinybird request-log shipper. Lives
# under feature `tinybird` so the dep is opt-in but enabled by default
# on Pylon Cloud builds (always-on at the binary level — gated at
# runtime by the absence of PYLON_TINYBIRD_TOKEN env, not at compile).
ureq = { workspace = true }
# WebSocket handshake on the multiplexed HTTP port: sha1 + base64
# compute Sec-WebSocket-Accept ourselves so tiny_http can hijack the
# socket without going back through tungstenite's accept path.
sha1 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
tempfile = "3"

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "sync_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "realtime_bench"
harness = false

