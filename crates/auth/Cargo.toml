[package]
name = "pylon-auth"
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pylon-kernel = { path = "../core", version = "0.4.10" }
pylon-http = { path = "../http", version = "0.4.10" }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
# Pure-Rust crypto + utilities that compile to wasm32. These are
# OK on every target the crate ships to.
base64 = { workspace = true }
# SHA-256 used for PKCE code_challenge derivation (RFC 7636 §4.2).
sha2 = { workspace = true }
# SHA-1 for HIBP Pwned Passwords + TOTP (RFC 6238 default algorithm).
# SHA-1 is broken for collisions but HIBP and TOTP both use it as the
# stable index/HMAC key. Not used for any modern hash-collision security.
sha1 = { workspace = true }
# HMAC used by TOTP (HMAC-SHA1) + JWT-shaped sessions (HMAC-SHA256).
hmac = { workspace = true }
# RFC 3339 timestamp parser for SIWE expiration_time / not_before fields.
chrono = { workspace = true }
# DEFLATE for SAML 2.0 HTTP-Redirect binding (Bindings §3.4.4).
flate2 = { workspace = true }

# Native-only deps. Each one drags in C code that doesn't cross-
# compile to wasm32-unknown-unknown:
#   - ring → vendored curve25519.c that clang can't target wasm
#   - samael → openssl-sys → C OpenSSL build
#   - ureq → native sockets (replaced on wasm32 by worker::Fetch)
#   - k256/argon2/rsa → pure-Rust but pull getrandom which needs
#     the `js` feature on wasm32 (handled in pylon-workers Cargo.toml
#     for the workers crate's own dep tree).
#
# The pylon-workers crate (Cloudflare Workers target) gates the
# modules that USE these deps via #[cfg(not(target_arch = "wasm32"))]
# in lib.rs. Without this split, pylon-router (and downstream
# pylon-workers) refuses to compile to wasm at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
samael = { workspace = true }
openssl = { version = "0.10", features = ["vendored"] }
ring = { workspace = true }
k256 = { workspace = true }
sha3 = { workspace = true }
argon2 = { workspace = true }
rsa = { workspace = true }

# rand pulls getrandom transitively. On wasm32 getrandom defaults
# to a target with no entropy source and refuses to compile —
# add the `js` feature so it uses browser/Workers crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
