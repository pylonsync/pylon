[package]
name = "pylon-kernel"
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# wasm32-unknown-unknown (Cloudflare Workers / the sync-relay Durable
# Object) has no std clock backend — `SystemTime::now()` panics there.
# `now_iso()` reads the time from JS `Date.now()` instead on that target
# so policy evaluation runs in the DO. Native builds never pull this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# Win32 ACL calls behind `secret_file::restrict_to_owner`. Windows has no
# chmod, so the 0600 the unix build applies to signing keys and stored
# credentials has to be spelled as an explicit DACL there.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

