[package]
name = "pylon-kernel"
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# wasm32-unknown-unknown (Cloudflare Workers / the sync-relay Durable
# Object) has no std clock backend — `SystemTime::now()` panics there.
# `now_iso()` reads the time from JS `Date.now()` instead on that target
# so policy evaluation runs in the DO. Native builds never pull this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

