[profile.ci]
# Bound memory use on hosted runners. Each test has its own process.
test-threads = 4
fail-fast = false

[test-groups]
shared-database = { max-threads = 1 }

[[profile.ci.overrides]]
# Keep tests that can share PostgreSQL tables in one serial group.
# The dedicated PostgreSQL CI job still uses serial cargo test commands.
filter = 'test(postgres) | test(pg_) | test(shard_cluster::) | test(shard_wasm::) | test(entity_writer::) | test(fn_calls::) | test(retention::) | test(workflows::) | test(crdt_privacy::) | binary(crdt_parity) | binary(shard_wasm)'
test-group = 'shared-database'
