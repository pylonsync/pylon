# Dependency updates. Security updates (a PR that fixes an open Dependabot
# alert) open as soon as the alert does. Version updates are weekly, one
# grouped PR per ecosystem, minor and patch only: a major version is a
# planned change, not a weekly PR. SECURITY.md has the response times.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directories:
      - /
      - /crates/studio_api/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      bun-minor:
        update-types: [minor, patch]

  # Base images are pinned by digest. A PR moves the tag and the digest
  # together when the base image gets a new build.
  - package-ecosystem: docker
    directories:
      - /
      - /builder
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
