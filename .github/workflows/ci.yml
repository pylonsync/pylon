name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # -----------------------------------------------------------------
  # Detect what changed. All expensive jobs gate on these outputs.
  # Docs-only / example-only / marketing-site-only changes return
  # rust=false + ts=false → every test job is skipped → the terminal
  # `ci-passed` job still runs and reports green so branch protection
  # doesn't block merges.
  # -----------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            ts:
              - 'packages/**'
              - 'package.json'
              - 'bun.lockb'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            swift:
              - 'packages/swift/**'
              - 'crates/cli/src/swift_codegen.rs'
              - '.github/workflows/ci.yml'

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cli-vendored:
    name: cli vendored files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches drift between /templates + /packages/sdk and the
      # copies vendored into crates/cli/. The vendored copies exist
      # because cargo publish strips paths outside the crate root.
      - run: bash tools/check-cli-vendored.sh

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # samael's build.rs shells out to `xmlsec1-config` and `libxml`'s
      # build.rs probes for libxml2 — both `panic!` (not a graceful error)
      # when the headers are absent. pylon-auth depends on samael
      # unconditionally on non-wasm targets, so EVERY rust job that compiles
      # the workspace needs these. Mirrors the install step in the `test` job.
      - name: Install xmlsec1 + libxml2 (SAML build deps)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      # pylon-studio-api's build.rs panics if web/dist/index.html is
      # missing — `dist/` is gitignored so every cargo invocation in CI
      # has to build it first. Same step as in the publish-crates job
      # of release.yml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo clippy --workspace --all-targets

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - name: Install xmlsec1 + libxml2 (Linux only — for SAML signature path)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - name: Install xmlsec1 + libxml2 (macOS — runner pre-installed via brew)
        if: matrix.os == 'macos-latest'
        run: brew install libxml2 libxmlsec1 || true
      # PYLON_RUN_XMLSEC_SIGN_TESTS opts in to the SAML cert-trust
      # regression tests on Linux. They're #[ignore]'d by default
      # because samael's IdP signing path SIGSEGVs on macOS dev boxes
      # (Homebrew xmlsec1 + OpenSSL 3 interop). --include-ignored
      # forces them to run when the env opt-in is set.
      - name: cargo test (Linux — includes xmlsec sign tests)
        if: matrix.os == 'ubuntu-latest'
        env:
          PYLON_RUN_XMLSEC_SIGN_TESTS: "1"
        run: cargo test --workspace --all-targets -- --test-threads=1 --include-ignored
      - name: cargo test (macOS — skips ignored)
        if: matrix.os == 'macos-latest'
        run: cargo test --workspace --all-targets -- --test-threads=1
      - run: cargo test --workspace --doc

  # Catastrophic-performance-regression gate. Runs the release-only
  # `perf_guard` tests (crates/runtime/tests/perf_guard.rs) — they assert each
  # core data-plane op stays within a generous (~20x+) wall-clock bound, so a
  # slow shared runner won't flake but an algorithmic blowup (dropped index,
  # O(n)->O(n^2), lock storm) fails the build with a message naming the op.
  # Release build is required: the bounds are calibrated to SIZING.md and the
  # tests cfg(not(debug_assertions)) themselves out of debug.
  perf-guard:
    name: perf guard
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install xmlsec1 + libxml2 (pylon-runtime build dep)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      # pylon-runtime pulls pylon-studio-api transitively, whose build.rs
      # panics if web/dist/index.html is missing. Build it first (same step
      # as the clippy/test/build jobs).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo test --release -p pylon-runtime --test perf_guard -- --nocapture

  build:
    name: build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Only the gnu target ships. The musl target was dropped here for
        # the same reason release.yml dropped it: pylon-auth links samael →
        # libxml2 + libxmlsec1 (system C libs) unconditionally, which can't
        # be satisfied by a static musl build. Re-add musl only alongside a
        # SAML-feature-gated build that excludes those libs.
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # libxml + samael build scripts panic without these headers (see clippy job).
      - name: Install xmlsec1 + libxml2 (SAML build deps)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo build --release --bin pylon --target ${{ matrix.target }}

  # Workers target build check. pylon-workers + transitives
  # (pylon-auth, pylon-router) must compile to wasm32 or every
  # Cloudflare Workers deployment stays broken — which is exactly
  # how this target slipped into unbuildable state historically.
  # Doesn't build the worker bundle (that needs `worker-build`
  # which downloads a wasm-opt binary not friendly to caching);
  # `cargo check` is enough to catch the regression class.
  wasm32-workers:
    name: wasm32 workers check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo check -p pylon-workers --features workers --target wasm32-unknown-unknown

  typescript:
    name: typescript packages
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run --filter '*' typecheck || true
        continue-on-error: true

  # End-to-end gate for @pylonsync/create-pylon. Catches the regression
  # that shipped 0.3.50 broken: real tabs in bin/create-pylon.js were
  # mangled into literal `\t` text, Node SyntaxError'd on parse, and
  # any inside-template `\\t` sequences emitted literal "\t" into
  # scaffolded TypeScript files. Runs on every PR and push so we
  # never publish a non-runnable scaffold again.
  create-pylon-smoke:
    name: create-pylon scaffold smoke test
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tools/smoke-create-pylon.sh

  audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      # RUSTSEC-2023-0071 (rsa "Marvin" timing sidechannel) has no fixed
      # upstream version. It requires an RSA *decryption* oracle to recover
      # a key. Pylon's `rsa` use is sign-only (crates/auth/src/oidc_provider.rs
      # issues OIDC ID tokens); SAML/SSO signature *verification* uses `ring`,
      # and the only payload decryption is ChaCha20. With no RSA decryption
      # path, the attack is unreachable here. Justification reviewed
      # 2026-06-11; revisit if a decrypting RSA code path is ever added or
      # the `rsa` crate ships a fix (then drop this ignore).
      - run: cargo audit --ignore RUSTSEC-2023-0071

  # -----------------------------------------------------------------
  # Terminal gate. Always runs (even when every real job is skipped),
  # fails if any of the real jobs actually failed or was cancelled.
  # Skipped jobs are treated as green.
  #
  # Set this as the one required check in the branch protection rule.
  # -----------------------------------------------------------------
  swift:
    name: swift build & test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift toolchain (Linux only)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10'
      - name: Install sqlite3 dev headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test --parallel

  ci-passed:
    name: CI passed
    needs: [changes, fmt, clippy, test, build, wasm32-workers, typescript, create-pylon-smoke, audit, swift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate job results
        shell: bash
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | grep -c '"result": "failure"' || true)
          cancelled=$(echo "$results" | grep -c '"result": "cancelled"' || true)
          if [[ "$failed" -gt 0 || "$cancelled" -gt 0 ]]; then
            echo "::error::One or more required jobs failed or were cancelled"
            echo "$results"
            exit 1
          fi
          echo "All jobs passed (or were skipped because no relevant code changed)."
