name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep file and line information without full debugger metadata.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # -----------------------------------------------------------------
  # Detect what changed. All expensive jobs gate on these outputs.
  # Docs-only / marketing-site-only changes return
  # rust=false + ts=false → every test job is skipped → the terminal
  # `ci-passed` job still runs and reports green so branch protection
  # doesn't block merges.
  # -----------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      images: ${{ steps.filter.outputs.images }}
      swift: ${{ steps.filter.outputs.swift }}
      csharp: ${{ steps.filter.outputs.csharp }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'rust-toolchain*'
              - '.config/nextest.toml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
            images:
              - 'Dockerfile'
              - 'builder/**'
              - 'docker/**'
              - '.trivyignore.yaml'
              - '.github/workflows/ci.yml'
            ts:
              - 'packages/**'
              - 'examples/**'
              - 'package.json'
              - 'bun.lockb'
              - 'bun.lock'
              # The scaffold + mobile bundle smoke scripts.
              - 'tools/**'
              - 'scripts/npm-postflight*'
              - '.github/workflows/ci.yml'
            swift:
              - 'packages/swift/**'
              - 'crates/cli/src/swift_codegen.rs'
              - '.github/workflows/ci.yml'
            csharp:
              - 'packages/csharp/**'
              - 'packages/realtime/src/*.fixtures.json'
              - '.github/workflows/ci.yml'

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cli-vendored:
    name: vendored files in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      # Catches drift between /templates + /packages/sdk and the copies
      # vendored into crates/cli/ (cargo publish strips paths outside the
      # crate root), and between /scripts and the installers the site
      # serves.
      - run: bash tools/check-cli-vendored.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      # Cargo.lock must already agree with the manifests. Nothing else in CI
      # passes --locked, but every binary build in release.yml does, so a
      # stale lock does not fail here — it fails after the tag exists, with
      # "cannot update the lock file because --locked was passed", and the
      # release has to be re-cut. Both v0.7.0 and v0.8.0 went that way:
      # release-please rewrites the versions it tracks and never touches
      # Cargo.lock. `cargo metadata` resolves without compiling, so this
      # costs seconds.
      #
      # bun.lock has no equivalent step because the `typescript packages`
      # job already installs with --frozen-lockfile.
      - name: Cargo.lock agrees with the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      # samael's build.rs shells out to `xmlsec1-config` and `libxml`'s
      # build.rs probes for libxml2 — both `panic!` (not a graceful error)
      # when the headers are absent. pylon-auth depends on samael
      # unconditionally on non-wasm targets, so EVERY rust job that compiles
      # the workspace needs these. Mirrors the install step in the `test` job.
      - name: Install xmlsec1 + libxml2 (SAML build deps)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      # pylon-studio-api's build.rs panics if web/dist/index.html is
      # missing — `dist/` is gitignored so every cargo invocation in CI
      # has to build it first. Same step as in the publish-crates job
      # of release.yml.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo clippy --workspace --all-targets

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      # wasm32: crates/runtime/tests/shard_wasm.rs builds the example guest.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          # Smoke jobs restore this cache; only the full test job saves it.
          shared-key: native-debug
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        shell: bash
        run: bun install --frozen-lockfile && bun run build
      - name: Install xmlsec1 + libxml2 (Linux only — for SAML signature path)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - name: Install xmlsec1 + libxml2 (macOS — runner pre-installed via brew)
        if: matrix.os == 'macos-latest'
        run: brew install libxml2 libxmlsec1 || true
      # Windows is in this matrix rather than only in the release workflow so
      # a unix-only assumption fails on the PR that introduces it, not on the
      # release that ships it.
      - name: Set up xmlsec1 (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 45
        uses: ./.github/actions/setup-xmlsec-windows
      # The C# live sign-in test runs in wasm-shard-smoke with a required SDK.
      # Clippy checks standalone benchmarks; perf-guard runs release benchmarks.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Rust tests
        run: cargo nextest run --profile ci --workspace --lib --bins --tests --examples -- --skip the_csharp_client_signs_in_with_apple_google_and_steam
      # Only the SAML signature tests need the Linux xmlsec opt-in.
      - name: SAML certificate trust
        if: matrix.os == 'ubuntu-24.04'
        env:
          PYLON_RUN_XMLSEC_SIGN_TESTS: "1"
        run: cargo test -p pylon-auth --test saml_cert_trust -- --test-threads=1 --ignored
      # Linux only. Nextest excludes doctests, so this is a SECOND
      # full compilation of the workspace — and on Windows that pass was
      # taking longer than everything else in the matrix combined. Doc
      # examples are plain Rust with no platform-specific paths, so compiling
      # them three times buys nothing.
      - name: cargo test --doc (Linux — doc examples are platform agnostic)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --workspace --doc
      # The Windows installer has no other gate: it is not exercised by any
      # build, and a syntax error in it only shows up when a user pipes it
      # into their shell. Parse it here.
      - name: Parse install.ps1
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::install.ps1: $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses clean"

  # Catastrophic-performance-regression gate. Runs the release-only
  # `perf_guard` tests (crates/runtime/tests/perf_guard.rs) — they assert each
  # core data-plane op stays within a generous (~20x+) wall-clock bound, so a
  # slow shared runner won't flake but an algorithmic blowup (dropped index,
  # O(n)->O(n^2), lock storm) fails the build with a message naming the op.
  # Release build is required: the bounds are calibrated to SIZING.md and the
  # tests cfg(not(debug_assertions)) themselves out of debug.
  perf-guard:
    name: perf guard
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - name: Install xmlsec1 + libxml2 (pylon-runtime build dep)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      # pylon-runtime pulls pylon-studio-api transitively, whose build.rs
      # panics if web/dist/index.html is missing. Build it first (same step
      # as the clippy/test/build jobs).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo test --release -p pylon-runtime --test perf_guard -- --nocapture

  build:
    name: build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Only the gnu target ships. The musl target was dropped here for
        # the same reason release.yml dropped it: pylon-auth links samael →
        # libxml2 + libxmlsec1 (system C libs) unconditionally, which can't
        # be satisfied by a static musl build. Re-add musl only alongside a
        # SAML-feature-gated build that excludes those libs.
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      # libxml + samael build scripts panic without these headers (see clippy job).
      - name: Install xmlsec1 + libxml2 (SAML build deps)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo build --release --locked --bin pylon --target ${{ matrix.target }}
      - name: Save release binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: ci-release-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/pylon
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  # Workers target build check. pylon-workers + transitives
  # (pylon-auth, pylon-router) must compile to wasm32 or every
  # Cloudflare Workers deployment stays broken — which is exactly
  # how this target slipped into unbuildable state historically.
  # Doesn't build the worker bundle (that needs `worker-build`
  # which downloads a wasm-opt binary not friendly to caching);
  # `cargo check` is enough to catch the regression class.
  wasm32-workers:
    name: wasm32 workers check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo check -p pylon-workers --features workers --target wasm32-unknown-unknown

  typescript:
    name: typescript packages
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Image dependency manifests match their sources
        run: bash tools/check-image-locks.sh
      - run: node --test scripts/npm-postflight.test.mjs
      - run: bun run check
      # The TS package tests ran nowhere until now — `check` is typecheck only,
      # so packages/sync's 200 sync tests and packages/react's mounted hook
      # tests were local-only and could rot unnoticed. Scoped to the two
      # packages that have suites rather than a repo-wide `bun test`, which
      # would sweep in templates' node_modules and examples.
      - run: bun test
        working-directory: packages/sync
      - run: bun test
        working-directory: packages/react
      # The replication decoder against frames the Rust encoder wrote.
      - run: bun test
        working-directory: packages/realtime
      # The launcher decides which platform binary runs, and getting it wrong
      # tells the user their machine is unsupported. It spawns node (not bun)
      # for the subject under test, so it exercises what users actually run.
      - run: bun test
        working-directory: packages/cli

  # End-to-end gate for @pylonsync/create-pylon. Catches the regression
  # that shipped 0.3.50 broken: real tabs in bin/create-pylon.js were
  # mangled into literal `\t` text, Node SyntaxError'd on parse, and
  # any inside-template `\\t` sequences emitted literal "\t" into
  # scaffolded TypeScript files. Runs on every PR and push so we
  # never publish a non-runnable scaffold again.
  create-pylon-smoke:
    name: create-pylon scaffold smoke test
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          package-manager-cache: false
          node-version: 22
      - run: bash tools/smoke-create-pylon.sh

  # The mobile template must bundle for iOS and Android with the packages
  # in this checkout. Metro resolves every import at build time, so a
  # Node-only module anywhere in the client import graph breaks every
  # native app; 0.8.3 shipped that way. tools/smoke-mobile-bundle.sh
  # scaffolds the template, overlays the local packages, and exports both
  # bundles.
  mobile-bundle:
    name: mobile template native bundles
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          package-manager-cache: false
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bash tools/smoke-mobile-bundle.sh

  # `pylon build` must write an artifact that `pylon start <dir>` runs with
  # no source tree and no node_modules. The smoke script scaffolds the
  # barebones template, overlays the local packages, builds with a browser
  # target, polyfills, an external package, and an include dir, then serves
  # the artifact from another directory. Windows is in the matrix because
  # path separators broke the client bundle there once (#15).
  production-build-smoke:
    name: production build smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: native-debug
          save-if: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          package-manager-cache: false
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        shell: bash
        run: bun install --frozen-lockfile && bun run build
      - name: Install xmlsec1 + libxml2 (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - name: Set up xmlsec1 (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 45
        uses: ./.github/actions/setup-xmlsec-windows
      - run: cargo build -p pylon-cli
      - name: Smoke test
        shell: bash
        run: bash tools/smoke-production-build.sh target/debug/pylon

  # The TS and Swift shard clients against a real MessagePack shard (wire
  # protocol v2): snapshots decode, binary inputs apply, acks advance, and a
  # refused input comes back as a rejection frame. macOS, for swift.
  shard-codecs:
    name: shard client codecs (TS + Swift)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: native-debug
          save-if: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - run: brew install libxml2 libxmlsec1 || true
      - run: bun install --frozen-lockfile
      - run: bash tools/smoke-shard-codecs.sh

  # Dependency advisories. Fails on a vulnerability with a fixed version;
  # every ignore has a reason and a review date (.cargo/audit.toml,
  # deny.toml, osv-scanner.toml). SECURITY.md has the policy.
  audit:
    name: dependency advisories
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Ignores are within their review dates
        run: bash tools/check-security-ignores.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      # Advisories, licenses and crate sources (deny.toml).
      - run: cargo deny check
      - name: osv-scanner on the lockfiles
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          # Exit 1 means findings; the gate decides which ones fail.
          ./osv-scanner scan source --config osv-scanner.toml --format json \
            --lockfile Cargo.lock --lockfile bun.lock \
            --lockfile crates/studio_api/web/bun.lock > osv.json || [ $? -eq 1 ]
          python3 tools/osv-gate.py < osv.json

  # The runtime image's Debian, Bun and npm layer (the Dockerfile's
  # runtime-base stage) and the builder image, scanned with Trivy. Fails on a
  # high or critical vulnerability with a fixed version. The Rust binary's
  # dependencies are covered by the audit job.
  image-scan:
    name: image scan
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime-base
            file: Dockerfile
            target: runtime-base
          # The npm packages the runtime image ships, installed frozen from
          # docker/*/bun.lock: a lockfile out of step fails here, not at
          # release time.
          - name: image-deps
            file: Dockerfile
            target: image-deps
          - name: builder
            file: builder/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Build ${{ matrix.name }}
        env:
          FILE: ${{ matrix.file }}
          TARGET: ${{ matrix.target }}
          TAG: pylon-${{ matrix.name }}:scan
        run: docker build -f "$FILE" ${TARGET:+--target "$TARGET"} -t "$TAG" .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pylon-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

  # -----------------------------------------------------------------
  # Terminal gate. Always runs (even when every real job is skipped),
  # fails if any of the real jobs actually failed or was cancelled.
  # Skipped jobs are treated as green.
  #
  # Set this as the one required check in the branch protection rule.
  # -----------------------------------------------------------------
  # macOS only. The Swift SDK depends on loro-swift, which ships as an
  # Apple xcframework binary (platforms: iOS, macOS, visionOS) with no
  # Linux build, so a Linux lane cannot compile the package. The former
  # ubuntu lane failed on every run it ever executed.
  swift:
    name: swift build & test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: swift build
        # Retry with backoff: SwiftPM downloads the LoroFFI binary
        # xcframework from GitHub releases on a cold cache, and that
        # download can time out when GitHub's release CDN degrades. The
        # failure is pre-compilation, so a plain re-run is safe.
        run: swift build || (sleep 30 && swift build) || (sleep 90 && swift build)
      - name: swift test
        run: swift test --parallel

  # The C# client: codecs, the client against a mock transport, the shard
  # connection against an in-process WebSocket server, and the replication
  # and wire fixtures the Rust encoders write. The live tests run in
  # wasm-shard-smoke against a real server.
  csharp:
    name: csharp tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5
        with:
          dotnet-version: "8.0.x"
      # The core as a .NET Standard 2.1 library with Unity's C# version and
      # warnings as errors: it must compile where Unity compiles it.
      - run: dotnet build "packages/csharp/Tests~/Pylon.Core"
      # The committed WebTransport plugin for this OS must load and work.
      - run: dotnet test "packages/csharp/Tests~/Pylon.Tests"
        env:
          PYLON_REQUIRE_PLUGIN: "1"

  # The C# client's WebTransport plugin: its C ABI against a local
  # WebTransport server, and the committed binaries built from the
  # current sources (run the "Shard client plugins" workflow to rebuild).
  shard-plugins:
    name: shard plugins current
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - name: The binaries match the sources
        run: |
          actual="$(crates/shard-client-ffi/source-hash.sh)"
          for group in android ios linux macos windows; do
            expected="$(awk -v g="$group" '$1 == g { print $2 }' crates/shard-client-ffi/plugins.sha256)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::The $group plugin in packages/csharp/Plugins was built from other sources (${expected:-none}, now $actual). Run the Shard client plugins workflow."
              exit 1
            fi
          done
          for f in \
            macOS/libpylon_shard_client.dylib \
            iOS/pylon_shard_client.xcframework/ios-arm64/pylon_shard_client.framework/pylon_shard_client \
            iOS/pylon_shard_client.xcframework/ios-arm64-simulator/pylon_shard_client.framework/pylon_shard_client \
            Android/arm64-v8a/libpylon_shard_client.so \
            Android/armeabi-v7a/libpylon_shard_client.so \
            Linux/x86_64/libpylon_shard_client.so \
            Windows/x86_64/pylon_shard_client.dll; do
            test -s "packages/csharp/Plugins/$f" || { echo "::error::packages/csharp/Plugins/$f is missing"; exit 1; }
          done
      - run: cargo test -p pylon-shard-client-ffi

  # examples/shard-arena: shard logic in Rust compiled to WebAssembly, run
  # by the stock binary from source and from a `pylon build` artifact, with
  # two TS clients over /shard on the main port.
  wasm-shard-smoke:
    name: WebAssembly shard smoke
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: native-debug
          save-if: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - name: Install xmlsec1 + libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5
        with:
          dotnet-version: "8.0.x"
      - run: bun install --frozen-lockfile
      - run: cargo build -p pylon-cli
      - run: bash tools/smoke-wasm-shard.sh target/debug/pylon
        env:
          PYLON_SMOKE_REQUIRE_DOTNET: "1"
      # The C# client's Apple, Google, and Steam sign-in against the real
      # routes (keys the test controls, a fake Steam Web API).
      - run: cargo test -p pylon-runtime --test native_signin_csharp
        env:
          PYLON_REQUIRE_DOTNET: "1"

  # Shards across machines: two pylon processes on one Postgres running
  # examples/shard-arena (placement, proxied connections, fly-replay, and
  # failover from saved state).
  shard-cluster-smoke:
    name: Shard cluster smoke
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        # The official image, copied to ghcr by mirror-ci-images.yml.
        # Anonymous pulls from Docker Hub and Amazon's public mirror share a
        # per-IP data limit across GitHub's runners and failed the job
        # before any test ran.
        image: ghcr.io/pylonsync/ci-postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: native-debug
          save-if: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.4"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - name: Install xmlsec1 + libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - run: bun install --frozen-lockfile
      - run: cargo build -p pylon-cli
      - name: Tests against Postgres
        env:
          PYLON_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          # One thread: these tests share one database and recreate tables.
          cargo test -p pylon-runtime --test postgres_backend -- --test-threads=1
          cargo test -p pylon-runtime --test crdt_parity -- --test-threads=1
          cargo test -p pylon-runtime --test postgres_write_round_trips -- --test-threads=1
          cargo test -p pylon-runtime --test postgres_auth_backends -- --test-threads=1
          cargo test -p pylon-runtime --test filtered_count -- --test-threads=1
          cargo test -p pylon-runtime --test postgres_change_log -- --test-threads=1
          cargo test -p pylon-runtime --test sync_scope_scan --test sync_scope_filter_parity -- --test-threads=1
          cargo test -p pylon-runtime --lib pg_workflow_store -- --test-threads=1
          cargo test -p pylon-runtime --lib search_reconcile::tests::pg -- --test-threads=1
          cargo test -p pylon-storage --features postgres-live --test postgres_performance --test postgres_live -- --test-threads=1
          cargo test -p pylon-runtime --lib shard_cluster
          cargo test -p pylon-runtime --lib shard_wasm::lease_tests
          cargo test -p pylon-runtime --lib shard_wasm::transfer::tests
          cargo test -p pylon-runtime --lib fn_calls
          cargo test -p pylon-runtime --lib entity_writer
          cargo test -p pylon-runtime --lib shard_wasm::data
          cargo test -p pylon-runtime --test shard_wasm -- transfers_on_a_cluster a_move_left_open a_dead_machine
      - name: Two machines
        env:
          PYLON_SMOKE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash tools/smoke-shard-cluster.sh target/debug/pylon

  ci-passed:
    name: CI passed
    needs:
      - changes
      - fmt
      - cli-vendored
      - clippy
      - test
      - perf-guard
      - build
      - wasm32-workers
      - typescript
      - create-pylon-smoke
      - production-build-smoke
      - shard-codecs
      - wasm-shard-smoke
      - shard-cluster-smoke
      - audit
      - image-scan
      - swift
      - csharp
      - shard-plugins
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate job results
        shell: bash
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | grep -c '"result": "failure"' || true)
          cancelled=$(echo "$results" | grep -c '"result": "cancelled"' || true)
          if [[ "$failed" -gt 0 || "$cancelled" -gt 0 ]]; then
            echo "::error::One or more required jobs failed or were cancelled"
            echo "$results"
            exit 1
          fi
          echo "All jobs passed (or were skipped because no relevant code changed)."
