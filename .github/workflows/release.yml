name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Workflow-level default. Individual jobs can narrow, but starting permissive
# here means every job gets the tokens it actually needs (contents for
# github releases, packages for ghcr, id-token for npm provenance + OIDC).
permissions:
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------
  # Gate: the CI workflow for this exact commit must have passed.
  #
  # A tag push does not run ci.yml, and nothing here used to depend on it,
  # so a red test suite on main never blocked a release (0.4.28 shipped
  # with `cargo fmt --check` failing; the stale default-deny tests were
  # red on main for weeks while releases kept publishing). Every job that
  # writes to a registry now depends on this one.
  #
  # The commit push and the tag push arrive together (`git push
  # --follow-tags`), so the CI run usually exists but is still running;
  # poll until it concludes. No run at all is a failure, not a pass.
  # ---------------------------------------------------------------
  ci-gate:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for ci.yml on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          echo "commit: $sha"
          deadline=$((SECONDS + 55 * 60))
          while :; do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" \
              --json databaseId,status,conclusion,url --limit 1 --jq '.[0] // empty')"
            if [[ -z "$run" ]]; then
              echo "no ci.yml run found for $sha yet"
            else
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r .conclusion <<<"$run")"
              url="$(jq -r .url <<<"$run")"
              echo "ci.yml: status=$status conclusion=$conclusion $url"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  exit 0
                fi
                echo "::error::ci.yml concluded '$conclusion' for $sha — fix main, then re-run this workflow ($url)"
                exit 1
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::gave up waiting for ci.yml on $sha"
              exit 1
            fi
            sleep 30
          done

  # ---------------------------------------------------------------
  # Sanity check: every published artifact must agree on the version.
  # Runs before anything mutates a registry.
  # ---------------------------------------------------------------
  verify:
    name: Verify versions match tag
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          CARGO_V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ "$CARGO_V" != "$TAG" ]]; then
            echo "::error::Cargo.toml workspace version $CARGO_V != tag $TAG"
            exit 1
          fi

          # Keep this list in sync with extra-files in release-please-config.json.
          # The CLI packages are here because release-please bumps them too; a
          # version that lags the tag would publish a CLI pinned to the wrong
          # platform binaries.
          for pkg in packages/sdk packages/functions packages/react packages/react-native packages/sync packages/loro packages/workflows packages/next packages/plugins/stripe packages/plugins/feature-flags packages/plugins/webhooks packages/plugins/revenuecat packages/create-pylon packages/cli packages/cli-darwin-arm64 packages/cli-linux-x64 packages/cli-win32-x64; do
            if [[ -f "$pkg/package.json" ]]; then
              PKG_V="$(node -p "require('./$pkg/package.json').version")"
              if [[ "$PKG_V" != "$TAG" ]]; then
                echo "::error::$pkg/package.json version $PKG_V != tag $TAG"
                exit 1
              fi
            fi
          done

  # ---------------------------------------------------------------
  # npm publish. Idempotent: skips a package if that version is
  # already on npm (lets us re-run the workflow without drama).
  # ---------------------------------------------------------------
  publish-npm:
    name: Publish npm packages
    needs: verify
    runs-on: ubuntu-latest
    # NPM_TOKEN lives under the `Production` environment (not as a
    # repository secret). Declaring the environment here is what grants
    # this job access. Same story for publish-crates below.
    environment: Production
    permissions:
      contents: read
      id-token: write        # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin to the same version the repo declares in package.json's
          # `packageManager`. `latest` upgraded to 1.3.x mid-cycle and
          # broke .npmrc env-var expansion → `bun publish` started
          # failing with "missing authentication" even though
          # NODE_AUTH_TOKEN was set. Pin tracks `packageManager`.
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Publish @pylonsync/* (skip-if-exists)
        # `bun publish` (not `npm publish`) is required: bun rewrites
        # `workspace:*` deps to the concrete sibling version at publish
        # time. npm publish ships them as-is, which produces broken
        # tarballs (npm install would try to resolve `workspace:*` and
        # fail).
        #
        # Auth: we write .npmrc into the repo root with the literal
        # token baked in. Earlier this step let actions/setup-node
        # write a temp .npmrc using ${NODE_AUTH_TOKEN} interpolation —
        # bun's discovery walks up from cwd, doesn't honor
        # $npm_config_userconfig the way npm does, so the temp file
        # was invisible after `cd $pkg`. Writing at the repo root
        # makes it discoverable from every package subdir.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # See note above on provenance — sigstore rejects bundles
          # referencing a private source repo. Flip to "true" once
          # pylonsync/pylon goes public.
          NPM_CONFIG_PROVENANCE: "false"
        shell: bash
        run: |
          set -euo pipefail

          # Sanity: prove the env binding is working before we touch
          # the registry. An empty NPM_TOKEN is the most common cause
          # of "missing authentication" — this fails loudly so the
          # cause shows up in the run summary instead of being buried.
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is empty in this job — the Production environment is not injecting it. Verify Settings → Environments → Production → Environment secrets contains NPM_TOKEN, and that the deployment branch/tag rules allow this ref." >&2
            exit 2
          fi
          echo "→ NPM_TOKEN length: ${#NPM_TOKEN}"

          # Write .npmrc with the literal token (no env-var ref). bun
          # discovers .npmrc by walking up from cwd, so a file at
          # the repo root is visible from every packages/* subdir.
          printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\nalways-auth=true\n' "$NPM_TOKEN" > .npmrc
          # Defense in depth: gitignore the file in this run so a
          # future `git add -A` somewhere can't accidentally commit it.
          echo ".npmrc" >> .gitignore

          # Prove npm itself accepts the token before bun gets a turn.
          # If this errors, the token is rejected by the registry —
          # regenerate at npmjs.com.
          npm whoami --registry=https://registry.npmjs.org

          # ---------------------------------------------------------------
          # Preflight: ensure every package about to be published declares
          # the SAME version. `bun publish` rewrites `workspace:*` deps to
          # whatever the local workspace version is at publish time. If
          # versions drift across packages (e.g. a half-finished release.sh
          # run leaves react@0.2.13 with sdk still at 0.2.12), each
          # publish ships internally-consistent metadata but the resulting
          # graph on npm becomes unsatisfiable: react@0.2.13 will pin
          # sdk@0.2.12 even though we're about to publish sdk@0.2.13.
          # Real-world bug we hit: 0.2.12 react/next published with
          # sdk/sync@0.2.7 deps that never existed on npm. This check
          # catches that BEFORE any package gets published, so the release
          # tag can be reverted and re-cut without leaving the registry
          # in a broken half-published state.
          # `packages/create-pylon` publishes as @pylonsync/create-pylon —
          # scoped name so the existing @pylonsync/* automation token
          # has rights to publish it. End users invoke via
          # `npm create @pylonsync/pylon@latest` (npm rewrites
          # `@pylonsync/pylon` to `@pylonsync/create-pylon`).
          PYLON_PKGS=(packages/sdk packages/sync packages/functions packages/react packages/client packages/react-native packages/loro packages/workflows packages/next packages/plugins/stripe packages/plugins/feature-flags packages/plugins/webhooks packages/plugins/revenuecat packages/create-pylon)
          REFERENCE_VERSION=""
          for pkg in "${PYLON_PKGS[@]}"; do
            [[ -f "$pkg/package.json" ]] || continue
            v="$(node -p "require('./$pkg/package.json').version")"
            if [[ -z "$REFERENCE_VERSION" ]]; then
              REFERENCE_VERSION="$v"
              echo "→ reference version: $REFERENCE_VERSION (from $pkg)"
            elif [[ "$v" != "$REFERENCE_VERSION" ]]; then
              echo "::error::Version mismatch in @pylonsync/* workspace: $pkg has $v, expected $REFERENCE_VERSION (matches $(echo ${PYLON_PKGS[0]})). Run ./release.sh <version> to bump everything in lockstep, then re-tag." >&2
              exit 3
            fi
          done

          # Also assert each rewritten dep would be satisfiable. We do
          # this by parsing the local package.json and confirming every
          # `@pylonsync/*` dep uses `workspace:*` (which bun rewrites to
          # REFERENCE_VERSION) — a literal version pin here would mean
          # someone bypassed the workspace protocol and we can't promise
          # the rewrite will land somewhere coherent.
          for pkg in "${PYLON_PKGS[@]}"; do
            [[ -f "$pkg/package.json" ]] || continue
            bad="$(node -e "
              const p = require('./$pkg/package.json');
              const all = { ...(p.dependencies||{}), ...(p.peerDependencies||{}) };
              for (const [k, v] of Object.entries(all)) {
                if (k.startsWith('@pylonsync/') && v !== 'workspace:*') {
                  console.log(\`\${k}=\${v}\`);
                }
              }
            ")"
            if [[ -n "$bad" ]]; then
              echo "::error::$pkg has non-workspace @pylonsync/* dep(s): $bad. Use \"workspace:*\" so bun's publish-time rewrite pins to the right version." >&2
              exit 4
            fi
          done

          # Lockfile-vs-package.json consistency. `bun publish` rewrites
          # `workspace:*` deps using the version bun resolved at the
          # last install — and with `--frozen-lockfile` that's whatever
          # bun.lock says, NOT the live package.json. If someone bumped
          # versions without refreshing bun.lock (manual sed, or a
          # release.sh that errored out mid-script), publish ships
          # packages whose internal deps pin to a version that may not
          # exist on npm. Real-world: v0.3.83 shipped react/react-native
          # /stripe/feature-flags/webhooks with sdk@0.3.81 pins because
          # bun.lock was still carrying 0.3.81 workspace metadata.
          # Catch the drift here, before any tarball uploads.
          # bun.lock is JSONC (trailing commas) — JSON.parse rejects
          # those, so strip them before parse. There are no block
          # comments in bun.lock; only trailing commas need handling.
          drift="$(node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('bun.lock', 'utf8');
            const cleaned = raw.replace(/,(\s*[}\]])/g, '\$1');
            const lock = JSON.parse(cleaned);
            const ws = lock.workspaces || {};
            const out = [];
            for (const [path, entry] of Object.entries(ws)) {
              if (!path.startsWith('packages/')) continue;
              const pkgJsonPath = path + '/package.json';
              if (!fs.existsSync(pkgJsonPath)) continue;
              const pkg = JSON.parse(fs.readFileSync(pkgJsonPath, 'utf8'));
              const lockV = entry.version;
              const fileV = pkg.version;
              if (lockV && fileV && lockV !== fileV) {
                out.push(path + ': bun.lock=' + lockV + ', package.json=' + fileV);
              }
            }
            if (out.length) {
              console.log(out.join('\n'));
              process.exit(1);
            }
          " 2>&1)" || {
            echo "::error::Lockfile drift detected — bun.lock workspace versions don't match package.json:" >&2
            echo "$drift" >&2
            echo "::error::Run \`./release.sh <version> --tag\` (which refreshes bun.lock from scratch) instead of bumping versions manually. The publish would ship broken internal @pylonsync/* deps to npm." >&2
            exit 6
          }

          # sync first: its siblings depend on it via workspace:*, so
          # the rewrite during their publish needs sync's published
          # version range to be queryable. (Bun rewrites to the local
          # workspace version regardless, but ordering by topology
          # keeps the registry consistent for anyone watching.)
          for pkg in "${PYLON_PKGS[@]}"; do
            [[ -f "$pkg/package.json" ]] || continue
            NAME="$(node -p "require('./$pkg/package.json').name")"
            VERSION="$(node -p "require('./$pkg/package.json').version")"
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "✓ $NAME@$VERSION already published — skipping"
            else
              echo "→ Publishing $NAME@$VERSION"
              (cd "$pkg" && bun publish --access public)
            fi
          done

          # Postflight: dry-resolve the published graph by trying to install
          # the packages the create-pylon templates actually pull in. If bun
          # can't satisfy the deps, we just produced another broken release —
          # fail loudly so the tag can be yanked before users hit it.
          #
          # @pylonsync/client is listed explicitly: the default `ssr` template
          # imports it (auth-form / dashboard), but nothing in @pylonsync/react's
          # own dep graph pulls it in — so a react-only postflight stayed green
          # while client was unpublished for releases, and every default scaffold
          # 404'd on `bun install`. Resolving it here closes that blind spot.
          #
          # Retry loop because npm's CDN takes 5-30s to propagate freshly-
          # published versions to all edge nodes, and bun's resolver can
          # fail with a hard "package not found" on the first try while
          # subsequent tries succeed. Twenty attempts × 15s = a 5-minute
          # window: 0.8.1 published every package and still failed a
          # 60-second window, and the CLI-package check below already
          # allows ~5 minutes for the same propagation.
          POSTFLIGHT_DIR="$(mktemp -d)"
          (
            cd "$POSTFLIGHT_DIR"
            cat > package.json <<EOF
          {
            "name": "pylon-postflight-check",
            "private": true,
            "dependencies": { "@pylonsync/react": "$REFERENCE_VERSION", "@pylonsync/client": "$REFERENCE_VERSION", "@pylonsync/loro": "$REFERENCE_VERSION" }
          }
          EOF
            attempt=0
            until bun install --no-save 2>&1 | tee install.log; do
              attempt=$((attempt + 1))
              if [[ "$attempt" -ge 20 ]]; then
                echo "::error::Postflight: bun install of @pylonsync/react@$REFERENCE_VERSION FAILED after 20 attempts over 5 minutes. Check the registry directly before yanking: every published package may be fine and only propagation slow." >&2
                cat install.log >&2
                exit 5
              fi
              echo "→ postflight attempt $attempt failed, retrying in 15s for npm CDN propagation..."
              sleep 15
            done
          )
          rm -rf "$POSTFLIGHT_DIR"

          rm -f .npmrc

  # ---------------------------------------------------------------
  # crates.io publish. katyo/publish-crates walks the workspace,
  # sorts topologically, skips unchanged crates, honors publish=false.
  #
  # CURRENTLY DISABLED. `cargo publish` runs a verification build
  # against the published versions of every dependency — it ignores
  # `[patch.crates-io]` in the workspace root. Our patch points
  # `samael` at vendor/samael/ to fix the libxmlsec 1.2.x vs 1.3.x
  # `xmlSecSize` type mismatch (u32 vs usize), but the publish
  # verifier sees plain crates.io samael 0.0.20 and fails on
  # `predigest_xml_from_raw_buffer(data_ptr, data_size)` —
  # `expected usize, found u32`.
  #
  # Re-enable when ANY of these is true:
  #   - samael upstream merges a fix that handles both libxmlsec1
  #     versions (track the upstream PR / issue)
  #   - we fork samael and publish under our own crate name, then
  #     swap the dependency in pylon-auth to that fork
  #   - we replace samael's xmlsec feature with an in-process
  #     XMLDSig verifier that doesn't depend on system libxmlsec1
  #
  # Until then: the binary + npm + Docker publish paths still ship,
  # which is what users actually consume. Crates.io publication is
  # for downstream Rust consumers embedding pylon as a library —
  # zero of those exist today.
  # ---------------------------------------------------------------
  publish-crates:
    name: Publish crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: Production
    if: false # see block comment above; re-enable when samael upstream is fixed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # samael's xmlsec feature requires libxml2 + libxmlsec1 dev
      # headers. publish-crates runs `cargo publish --dry-run`-style
      # verification builds, which need these to compile pylon-auth.
      # Ubuntu 24.04 (noble) ships libxmlsec1 1.3.x — matches what
      # samael 0.0.20's bindgen expects.
      - name: Install xmlsec deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxml2-dev libxmlsec1-dev libxmlsec1-openssl \
            libclang-dev clang
      # `pylon-studio-api`'s build.rs requires `web/dist/index.html` to
      # exist (the Studio UI bundle). dist/ is gitignored, so CI must
      # build it before any cargo step runs. Without this, the entire
      # workspace fails to compile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        run: bun install --frozen-lockfile && bun run build
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
          check-repo: false
          # Studio UI bundle (`crates/studio_api/web/dist/`) is built
          # in the previous step but is gitignored — the workspace
          # is therefore "dirty" from cargo's perspective. Allow it,
          # otherwise pylon-studio-api never publishes.
          args: "--allow-dirty"

  binaries:
    name: binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # x86_64-apple-darwin (Intel Mac) intentionally not built —
          # macos-13 (the last GitHub-hosted Intel runner) is no longer
          # reliably available; jobs queued against it sit for 24h then
          # cancel. Cross-compiling x86_64 from arm64 broke openssl-sys
          # + libxmlsec1 (both look up deps via pkg-config, neither
          # installs a cross toolchain via brew, vendoring openssl alone
          # wasn't enough — libxmlsec1 is the next tripwire). Apple
          # Silicon's Rosetta translation only runs Intel binaries on
          # ARM Macs, NOT the reverse, so the dispatcher can't fall back.
          # Intel Mac users on macOS 14+ are a small + shrinking minority
          # (Apple stopped selling Intel Macs in 2023); they can build
          # from source via https://github.com/pylonsync/pylon. Add this
          # target back once we either get a self-hosted Intel runner or
          # solve the libxmlsec1 cross-compile.
          # Dropped temporarily: x86_64-unknown-linux-musl (alpine has
          # no libxmlsec1 package fitting samael's needs) and
          # aarch64-unknown-linux-gnu (cross-compiling libxmlsec1 from
          # ubuntu-latest is non-trivial). Add back once we either
          # static-link xmlsec1 or drop samael's xmlsec feature in
          # favor of an in-process verifier.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          # Windows gets the same SAML support as every other target. Its
          # libxmlsec1 comes from vcpkg, whose `xmlsec` port builds the
          # same `xmlsec1` + `xmlsec1-openssl` pair the autotools build
          # produces; vendor/samael/bindings.rs takes the vcpkg path when
          # the target ABI is msvc. A SAML-disabled Windows variant was
          # never on the table.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      # samael's xmlsec feature requires libxmlsec1 1.3.x (where
      # xmlSecSize is `size_t`/Rust `usize`). Ubuntu noble + Debian
      # bookworm ship 1.2.x where the type is `unsigned int`/`u32`, and
      # samael's Rust code passes the value as `usize` — hard compile
      # error. Trixie + Homebrew ship 1.3.x.
      #
      # We patch samael in-tree (see [patch.crates-io] in root Cargo.toml)
      # to handle the type mismatch, so the system libxmlsec1 version
      # matters less here — Ubuntu's 1.2.x is fine for linkage. The
      # patch covers the compile-time bindgen mismatch.
      - if: runner.os == 'Linux'
        # Hard cap + retry: a hung apt mirror once wedged this step for
        # 4h with no timeout, blocking the whole release queue. Fail
        # fast and retry a fresh mirror instead.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get update && \
               sudo timeout 300 apt-get install -y \
                 libxml2-dev libxmlsec1-dev libxmlsec1-openssl \
                 libclang-dev clang; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1
      - if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          brew install libxmlsec1 libxml2 pkg-config
          brew link --overwrite libxmlsec1 || true
      - name: Set up xmlsec1 (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 45
        uses: ./.github/actions/setup-xmlsec-windows
      # `pylon-studio-api`'s build.rs requires `web/dist/index.html` to
      # exist. Build the Studio UI bundle before cargo runs.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Build Studio UI bundle
        working-directory: crates/studio_api/web
        shell: bash
        run: bun install --frozen-lockfile && bun run build
      - name: Build
        run: cargo build --release --locked --bin pylon --target ${{ matrix.target }}
      # The SAML verifier links libxmlsec1, which on macOS comes from Homebrew,
      # so a fresh build carries absolute /opt/homebrew paths and dyld aborts on
      # any machine without that exact prefix populated. Since this binary ships
      # through npm, that made `npm install @pylonsync/cli` hand people something
      # that could not start unless they happened to have run `brew install
      # libxmlsec1` — including on a new Mac set up from an Intel one, where
      # Migration Assistant leaves Homebrew at the /usr/local prefix.
      #
      # Vendor the closure next to the binary instead and rewrite the references
      # to @loader_path/lib/, which resolves in both shipping layouts (the npm
      # package's bin/pylon + bin/lib/, and the tarball's pylon + lib/).
      - name: Bundle libxmlsec1 + deps into the binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/bundle-macos-dylibs.sh "target/$TARGET/release/pylon"

      # Artifact names must match what install.sh and Formula/pylon.rb
      # expect: pylon-${TAG}-${TARGET}.{tar.gz,zip}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
          OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          cd "target/$TARGET/release"
          # macOS carries its vendored dylibs in lib/ (see the bundle step above)
          # and the binary resolves them via @loader_path, so the archive has to
          # keep the two side by side. The Linux build links its deps from the
          # distro and ships the binary alone.
          if [ "$OS_NAME" = "macOS" ]; then
            tar czf "../../../pylon-$TAG-$TARGET.tar.gz" pylon lib
          else
            tar czf "../../../pylon-$TAG-$TARGET.tar.gz" pylon
          fi
      # The Windows build links its C dependencies statically (see the vcpkg
      # setup above), so the archive is the single .exe.
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "target/$env:TARGET/release/pylon.exe" `
            -DestinationPath "pylon-$env:TAG-$env:TARGET.zip"
      - name: Compute SHA256 (unix)
        if: matrix.archive == 'tar.gz' && runner.os == 'Linux'
        run: |
          sha256sum pylon-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            > pylon-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - name: Compute SHA256 (macOS)
        if: matrix.archive == 'tar.gz' && runner.os == 'macOS'
        run: |
          shasum -a 256 pylon-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            > pylon-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      # install.ps1 and install.sh both read the hash as the first
      # whitespace-separated field, so match `sha256sum`'s "<hash>  <name>"
      # shape rather than Get-FileHash's default object rendering.
      - name: Compute SHA256 (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "pylon-$env:TAG-$env:TARGET.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Out-File -FilePath "$asset.sha256" -Encoding ascii -NoNewline
      # Publish to the private source repo (so internal tooling, the
      # release-please flow, and crates/npm jobs all observe the same tag).
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pylon-${{ github.ref_name }}-${{ matrix.target }}.*
      # Mirror the same artifacts to the public release repo. This is the
      # download surface install.sh and the Homebrew formula point at — keeps
      # binaries reachable while the source repo is still private. Append-only
      # against an existing release tag (idempotent across matrix jobs).
      - name: Publish to public release repo
        uses: softprops/action-gh-release@v2
        with:
          repository: pylonsync/pylon-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            pylon-${{ github.ref_name }}-${{ matrix.target }}.*
      # Stash the raw binary as a workflow artifact too so the
      # `publish-cli-npm` job downstream can grab all four platform
      # binaries without re-downloading from the GitHub release. Keyed
      # by target so the assembly step can map to the right
      # @pylonsync/cli-* package directly.
      - name: Upload raw binary artifact
        if: matrix.archive == 'tar.gz'
        uses: actions/upload-artifact@v4
        with:
          name: pylon-bin-${{ matrix.target }}
          # lib/ only exists for macOS (the vendored libxmlsec1 closure) and
          # the binary is useless without it. Listing both puts the common
          # parent at the artifact root, so the layout the binary expects
          # survives the round trip; Linux just contributes the binary.
          path: |
            target/${{ matrix.target }}/release/pylon
            target/${{ matrix.target }}/release/lib
          retention-days: 1
          if-no-files-found: error
      # Windows has no lib/ closure to carry, so the artifact is the .exe on
      # its own. Same artifact-name shape as the unix targets, which is what
      # `publish-cli-npm` maps over.
      - name: Upload raw binary artifact (windows)
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: pylon-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/pylon.exe
          retention-days: 1
          if-no-files-found: error

  publish-cli-npm:
    name: Publish @pylonsync/cli + platform packages
    needs: [binaries, verify]
    runs-on: ubuntu-latest
    # Same Production environment as the SDK npm publish — gives access
    # to NPM_TOKEN. id-token write is for npm provenance, currently
    # disabled (see NPM_CONFIG_PROVENANCE below).
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Pull every binary artifact uploaded by the binaries matrix.
      # Each lands at artifacts/<artifact-name>/pylon.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pylon-bin-*
      - name: Stage platform packages
        shell: bash
        run: |
          set -euo pipefail
          # Map rust target → npm platform package directory. musl is
          # intentionally skipped for now; anyone needing it can still grab
          # the binary from the GitHub release.
          # x86_64-apple-darwin + aarch64-unknown-linux-gnu intentionally
          # absent — see binary matrix comment for why. Add the line back
          # here once the binary itself is being built again.
          declare -A TARGET_TO_PKG=(
            [aarch64-apple-darwin]=cli-darwin-arm64
            [x86_64-unknown-linux-gnu]=cli-linux-x64
            [x86_64-pc-windows-msvc]=cli-win32-x64
          )
          for target in "${!TARGET_TO_PKG[@]}"; do
            pkg="${TARGET_TO_PKG[$target]}"
            # Windows carries the .exe suffix into the package, because that
            # is the name the dispatcher spawns.
            exe="pylon"
            case "$target" in *windows*) exe="pylon.exe" ;; esac
            src="artifacts/pylon-bin-${target}/${exe}"
            dest="packages/${pkg}/bin/${exe}"
            if [[ ! -f "$src" ]]; then
              echo "::error::Missing binary artifact for $target at $src" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
            chmod +x "$dest"
            # macOS binaries load their vendored dylibs from lib/ next to
            # themselves. Ship it or the package installs and then aborts in
            # dyld on first run.
            libsrc="artifacts/pylon-bin-${target}/lib"
            if [[ -d "$libsrc" ]]; then
              cp -R "$libsrc" "$(dirname "$dest")/lib"
              echo "  ↳ staged $(ls "$libsrc" | wc -l | tr -d ' ') vendored dylibs → $pkg/bin/lib/"
            fi
            echo "✓ staged $target → $pkg/bin/$exe ($(stat -c%s "$dest" 2>/dev/null || stat -f%z "$dest") bytes)"
          done
          # A macOS package without lib/ would publish cleanly and fail on
          # every user's machine, so fail the release here instead.
          if [[ ! -d packages/cli-darwin-arm64/bin/lib ]]; then
            echo "::error::cli-darwin-arm64 has no bin/lib — the macOS build did not vendor its dylibs" >&2
            exit 1
          fi
      - name: Auth + preflight
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\nalways-auth=true\n' "$NPM_TOKEN" > .npmrc
          echo ".npmrc" >> .gitignore
          npm whoami --registry=https://registry.npmjs.org

          # Lockstep check: every CLI package must declare the SAME
          # version, and the dispatcher's optionalDependencies must pin
          # to that version exactly. Drift here is the same class of bug
          # that broke @pylonsync/react@0.3.0 (workspace:* rewrite shipped
          # mismatched deps) — catch it before publish.
          # cli-darwin-x64 + cli-linux-arm64 intentionally absent — those
          # platform binaries aren't built (see binary matrix), so they
          # aren't published. Their package.jsons stay in the workspace
          # with stale versions; the version-match check skips anything
          # not in this list.
          CLI_PKGS=(packages/cli packages/cli-darwin-arm64 packages/cli-linux-x64 packages/cli-win32-x64)
          REF=""
          for pkg in "${CLI_PKGS[@]}"; do
            v="$(node -p "require('./$pkg/package.json').version")"
            if [[ -z "$REF" ]]; then REF="$v"; fi
            if [[ "$v" != "$REF" ]]; then
              echo "::error::Version mismatch in @pylonsync/cli-*: $pkg has $v, expected $REF. Run ./release.sh to bump in lockstep." >&2
              exit 3
            fi
          done
          # Confirm the dispatcher's optionalDependencies pin to the
          # same version (NOT a range — exact match needed because the
          # dispatcher uses require.resolve at runtime).
          bad="$(node -e "
            const p = require('./packages/cli/package.json');
            for (const [k, v] of Object.entries(p.optionalDependencies || {})) {
              if (v !== '$REF') console.log(\`\${k}=\${v}\`);
            }
          ")"
          if [[ -n "$bad" ]]; then
            echo "::error::@pylonsync/cli optionalDependencies don't match version $REF: $bad" >&2
            exit 4
          fi
      - name: Publish platform packages then dispatcher
        env:
          NPM_CONFIG_PROVENANCE: "false"
        shell: bash
        run: |
          set -euo pipefail
          # Platform packages first — they have no @pylonsync/* deps,
          # so they publish standalone. The dispatcher publishes last
          # because its optionalDependencies must already exist on npm
          # for the install-time `bun install --frozen-lockfile`
          # postflight to resolve.
          for pkg in cli-darwin-arm64 cli-linux-x64 cli-win32-x64 cli; do
            NAME="$(node -p "require('./packages/$pkg/package.json').name")"
            VERSION="$(node -p "require('./packages/$pkg/package.json').version")"
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "✓ $NAME@$VERSION already published — skipping"
            else
              echo "→ Publishing $NAME@$VERSION"
              (cd "packages/$pkg" && bun publish --access public)
            fi
          done

      # A brand-new scoped package is not immediately readable without a
      # token: @pylonsync/cli-win32-x64 published in v0.8.0, and an
      # unauthenticated GET 404'd for ~3.5 minutes afterwards while its
      # already-existing siblings answered 200 straight away.
      #
      # That window matters because npm SKIPS an optionalDependency it cannot
      # fetch. A Windows `npm i @pylonsync/cli` during it succeeds and then
      # reports no prebuilt binary for the platform — an install that looks
      # fine and is not. Wait for each package to actually be reachable, the
      # way a user's install reaches it, before calling the release done.
      #
      # This also fails loudly on the other cause of a 404 here: a first
      # publish that landed as `restricted` rather than public.
      - name: Every CLI package is publicly resolvable
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for pkg in cli-darwin-arm64 cli-linux-x64 cli-win32-x64 cli; do
            NAME="$(node -p "require('./packages/$pkg/package.json').name")"
            ENC="${NAME/@/%40}"; ENC="${ENC//\//%2f}"
            code=""
            # ~5 minutes: the observed propagation delay was 3.5.
            for attempt in $(seq 1 20); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${ENC}" || true)"
              [ "$code" = "200" ] && break
              sleep 15
            done
            if [ "$code" != "200" ]; then
              echo "::error::$NAME is not publicly readable (HTTP $code). npm silently skips an unreachable optionalDependency, so the CLI would report no prebuilt binary for that platform. Check whether the package published as restricted." >&2
              fail=1
            else
              echo "✓ $NAME is publicly resolvable"
            fi
          done
          exit "$fail"

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version tag is immutable. Re-running a release used to
      # rebuild and re-push it, and the build is not reproducible, so the same
      # tag came back pointing at a different image.
      #
      # That is not theoretical. 0.3.309 and 0.4.27 were both re-pushed, and
      # two Cloud projects (chat-api, revtrail) had to be pinned to the
      # original digests to keep booting -- the newer build under 0.3.309 binds
      # 127.0.0.1, which the Fly proxy cannot reach. Anyone reading those pins
      # later sees drift, unpins to the tag, and takes the app down. That
      # happened on 2026-08-28.
      #
      # Skip-if-exists, matching the npm job above, so a re-run after a partial
      # failure still completes the legs that did not publish. The moving tags
      # (latest, {{major}}.{{minor}}) are skipped along with it: if the version
      # is already up, they were pointed at it by the run that pushed it.
      - name: Refuse to overwrite a published version tag
        id: immutable
        shell: bash
        run: |
          set -euo pipefail

          # workflow_dispatch has no tag ref, and metadata-action emits no
          # semver tag for it either, so there is nothing to protect.
          case "${GITHUB_REF:-}" in
            refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}" ;;
            *)
              echo "not a version tag ref — nothing to guard"
              echo "pylon=false"   >> "$GITHUB_OUTPUT"
              echo "builder=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          check () {
            local img="$1" out="$2"
            local ref="ghcr.io/${OWNER}/${img}:${VERSION}"
            # Already logged in above; exit 0 means the tag resolves.
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::warning::${ref} already exists — NOT overwriting it. A published version tag must keep pointing at the image it shipped with; re-pushing is what forced the chat-api and revtrail digest pins. To ship different bits, cut a new version."
              echo "${out}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${ref} is unpublished — safe to push"
              echo "${out}=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check pylon         pylon
          check pylon-builder builder

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/pylon
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        if: steps.immutable.outputs.pylon != 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-platform for now. linux/arm64 via QEMU emulation
          # quadruples the build time (45+ min cold, painful even
          # warm) and we have no native arm64 runners. Add it back
          # once we either: (a) introduce a separate arm64 build job
          # on a GitHub-hosted ARM runner, or (b) accept the wait
          # and queue parallel jobs by platform via matrix.
          platforms: linux/amd64
          # GHA cache backend persists buildx layers across runs so
          # the cargo dep tree (~80% of build time) doesn't recompile
          # unless Cargo.lock actually changed. mode=max preserves
          # intermediate layers, not just the final image — saves
          # the rust-builder stage's deps cache too.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # pylon-builder: the ephemeral image the Cloud build-artifact pipeline
      # runs on a throwaway Fly machine (builder/Dockerfile). Tiny + fast to
      # build (Bun base + one script), so it rides the same release.
      - uses: docker/metadata-action@v5
        id: meta-builder
        with:
          images: ghcr.io/${{ github.repository_owner }}/pylon-builder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        if: steps.immutable.outputs.builder != 'true'
        with:
          context: .
          file: builder/Dockerfile
          push: true
          tags: ${{ steps.meta-builder.outputs.tags }}
          labels: ${{ steps.meta-builder.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # Tell Pylon Cloud the release exists so its PYLON_RELEASE pin moves.
  #
  # The control plane derives the customer runtime image, the builder
  # image, and the dev-box image from that one secret. It used to be
  # bumped by hand, and was not: PYLON_DEFAULT_IMAGE sat on 0.3.283 for
  # months while releases kept shipping. Runs only after every leg that a
  # cloud deploy depends on has published (npm packages for the builder's
  # `bun install`, the CLI packages, and the runtime image).
  #
  # The receiving workflow lives in the control-plane repo (PYLON_CLOUD_REPO)
  # (.github/workflows/pylon-release.yml). It re-checks that the image
  # tag and the npm packages are reachable before it touches the secret.
  # ---------------------------------------------------------------
  notify-cloud:
    name: Bump PYLON_RELEASE on Pylon Cloud
    needs: [verify, publish-npm, publish-cli-npm, docker]
    runs-on: ubuntu-latest
    steps:
      # The control-plane repo is moving into the stack0 GitHub org. The
      # target comes from the PYLON_CLOUD_REPO repository variable so the
      # move is a one-value change here; the default is the current home.
      - name: Dispatch pylon-release to the control-plane repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          CLOUD_REPO: ${{ vars.PYLON_CLOUD_REPO || 'pylonsync/pylon-cloud' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$CLOUD_REPO/dispatches" \
            -f event_type=pylon-release \
            -F "client_payload[version]=$VERSION" \
            -F "client_payload[sha]=$GITHUB_SHA"
          echo "dispatched pylon-release $VERSION to $CLOUD_REPO"
