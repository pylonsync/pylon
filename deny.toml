# cargo deny: advisories, licenses, and where crates come from. CI runs
# `cargo deny check` (the audit job) on every Rust change.
#
# Every ignored advisory has a reason and a review date. CI fails when a
# review date has passed (tools/check-security-ignores.sh), so an ignore is
# looked at again instead of staying forever. SECURITY.md has the policy.

[graph]
all-features = true

[advisories]
# Unsound notices fail CI for crates the workspace depends on directly.
# Unmaintained notices are not vulnerabilities and do not fail CI; the
# nightly scan lists them (bincode 1 and rustls-pemfile as of 2026-10-23).
unmaintained = "none"
unsound = "workspace"
yanked = "warn"
ignore = [
    # rsa "Marvin" timing side channel. No fixed version exists. The attack
    # needs an RSA decryption oracle. Pylon only signs with rsa (OIDC ID
    # tokens in crates/auth/src/oidc_provider.rs); SAML verification uses
    # ring and payload decryption is ChaCha20.
    { id = "RUSTSEC-2023-0071", reason = "sign-only rsa use; no fix upstream. Review by 2027-01-31." },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Pylon's own license (the workspace crates).
    "FSL-1.1-ALv2",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
