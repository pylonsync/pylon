# xcodegen spec for the iOS build of __APP_NAME__.
#
# Materialize the Xcode project once with:
#     brew install xcodegen
#     xcodegen generate
# Then open __APP_NAME_PASCAL__.xcodeproj. Run xcodegen again after you add
# or remove Swift files.
#
# The app talks to the Pylon backend in apps/api. Start it with `pylon dev`
# there. The simulator reaches http://localhost:4321; on a device, set
# PYLON_BASE_URL in the scheme's environment to your Mac's LAN address or
# your deployed API.

name: __APP_NAME_PASCAL__
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

packages:
  pylon:
    url: https://github.com/pylonsync/pylon.git
    from: "__PYLON_VERSION__"

targets:
  __APP_NAME_PASCAL__:
    type: application
    platform: iOS
    sources:
      - path: Sources/__APP_NAME_PASCAL__
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "__APP_NAME__"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_NSAppTransportSecurity: "{NSAllowsLocalNetworking = YES;}"
    dependencies:
      - package: pylon
        product: PylonClient
      - package: pylon
        product: PylonSync
      - package: pylon
        product: PylonSwiftUI
